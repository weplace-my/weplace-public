# Include inside EVERY server {} block serving this checkout (HTTP and HTTPS).
# ^~ prevents other regex locations or static-file handlers from taking priority.
location ^~ /.git {
    return 404;
}

# Also protect repository metadata below nested paths.
location ~* /\.(git|svn|hg)(/|$) {
    return 404;
}

# Hidden files, including .env and .DS_Store, except ACME/association files.
location ~ /\.(?!well-known(?:/|$)) {
    return 404;
}

location ^~ /deploy/ {
    return 404;
}
