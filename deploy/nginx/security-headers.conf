# Include in each server {} serving the public site. Existing location-level
# add_header directives override inheritance; include these there too if needed.
server_tokens off;
autoindex off;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Inline styles/scripts are currently used by the QR page and map/template.
# This baseline blocks plugins/framing/base URL injection without breaking them.
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
