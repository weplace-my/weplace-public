name: Deploy public site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout verification script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build public files only
        run: |
          python3 -m unittest discover -s deploy -p 'test_*.py'
          node --test deploy/map-security.test.cjs
          python3 deploy/build-public.py dist

      - name: Setup verified SSH host
        env:
          DEPLOY_KEY: ${{ secrets.DEV_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEV_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'Set DEV_KNOWN_HOSTS to an independently verified SSH host key'; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Publish static artifact without repository metadata
        env:
          DEPLOY_HOST: ${{ secrets.DEV_HOST }}
          DEPLOY_USER: ${{ secrets.DEV_USER }}
          DEPLOY_PATH: ${{ vars.DEV_PATH }}
        run: |
          set -eu
          # Reject shell metacharacters and dangerously broad document roots.
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/([a-zA-Z0-9_-]+/)+[a-zA-Z0-9_-]+$ ]]
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" "
            set -eu
            test -d '$DEPLOY_PATH'
            test ! -L '$DEPLOY_PATH'
            test '$DEPLOY_PATH' != \"\$HOME\"
            test -f '$DEPLOY_PATH/index.html'
            test -d '$DEPLOY_PATH/assets'
            command -v rsync >/dev/null
          "
          # This directory must be dedicated to the public site. --delete removes
          # the old served .git/.github checkout; preserve ACME/association files.
          rsync -az --delay-updates --delete-delay --exclude='/.well-known/' \
            -e 'ssh -o BatchMode=yes -o StrictHostKeyChecking=yes' \
            dist/ "$remote:$DEPLOY_PATH/"

      - name: Verify private files are blocked
        run: bash deploy/check-repository-access.sh https://weplace.my
