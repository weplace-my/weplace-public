name: Deploy public site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup SSH
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEV_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.DEV_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy latest main revision
        run: |
          set -eu
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" "
            cd ${{ vars.DEV_PATH }} &&
            git pull --ff-only origin main &&
            sudo systemctl reload nginx
          "
